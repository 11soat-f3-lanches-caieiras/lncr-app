        - basicAuth: []
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        $ref: '#/components/requestBodies/PartialUpdateCustomer'
      responses:
        '200':
          $ref: '#/components/responses/PartialUpdateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
