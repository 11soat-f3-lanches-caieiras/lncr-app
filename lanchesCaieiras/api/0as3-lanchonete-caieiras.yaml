      summary: Buscar Pedido do cliente por id
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerOrderId'
      responses:
        '200':
          $ref: '#/components/responses/GetCustomerOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customerOrder/payment:
    post:
      operationId: customerOrderPayments
