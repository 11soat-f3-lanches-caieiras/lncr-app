      summary: Recebe informação que o pagamento do pedido do cliente foi realizado
      tags:
        - CollectionOperations
      requestBody:
        $ref: '#/components/requestBodies/CreateCustomerOrderPayments'
      responses:
        '200':
          $ref: '#/components/responses/CreatedCustomerOrderPayments'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    parameters: []
  '/customerOrder/{id}/{newStatus}':
    patch:
      operationId: customerOrderUpdateStatus
      description: Atualizar status do pedido do cliente
      summary: Atualizar status do pedido do cliente
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerOrderId'
        - $ref: '#/components/parameters/CustomerOrderNewStatus'
