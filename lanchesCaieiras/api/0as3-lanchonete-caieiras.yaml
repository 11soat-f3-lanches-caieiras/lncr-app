        - basicAuth: []
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          $ref: '#/components/responses/DeletedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customerOrders:
    post:
      operationId: createCustomerOrder
      description: Criar um novo pedido do Cliente
      summary: Criar um novo pedido do Cliente
      tags:
        - CollectionOperations
      requestBody:
        $ref: '#/components/requestBodies/CreateCustomerOrder'
      responses:
        '200':
          $ref: '#/components/responses/CreatedCustomerOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
