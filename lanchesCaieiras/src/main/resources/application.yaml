server:
  port: 8080
spring:
  application:
    name: Lanches Caieiras
  datasource:
    url: jdbc:postgresql://localhost:5432/db-lanches-caieiras
    username: lncr-admin #.env
    password: Lncr$1234 #.env
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  web:
    cors:
      mapping:
        "/**":
          allowed-origins: "https://webhook.site"
          allowed-methods: "POST"
          allowed-headers: "*"
          allow-credentials: true
lncr:
  base-url: "http://localhost:8080"
  integration:
    food-items-url: "${lncr.base-url}/foodItems"
    customers-url: "${lncr.base-url}/customers"
    customers-order-url: "${lncr.base-url}/customers"
  customer:
    location-prefix: "${lncr.base-url}/customers"
  customer-order:
    location-prefix: "${lncr.base-url}/customersOrders"
  food-item:
    location-prefix: "${lncr.base-url}/foodItems"
  food-item-image:
    location-prefix: "${lncr.base-url}/foodItems/image"
    directory: "../storage/images/"
    maxSize: 524288 # 512 KB
    extensions:
      ".jpg": "FFD8"
      ".png": "89504E47"
  mercadopago:
    location-prefix: "${lncr.base-url}/payments/mercadoPago"
    callbackUrl: "https://webhook.site/a208949d-4727-4147-9d37-1f34f8615fe8" #Webhook para notificação de pagamento
    chargeUrl: "https://api.mercadopago.com/instore/orders/qr/seller/collectors/${lncr.mercadopago.userId}/pos/${lncr.mercadopago.posId}/qrs"
    paymentUrl: "https://api.mercadopago.com/v1/payments"
    accessToken: "APP_USR-4844709428317965-050720-a1e0405e0cbddf8c771622cfdbf2ebc0-2425846779" #.env
    userId: "2425846779" #.env
    posId: "SUC001POS001" #.env