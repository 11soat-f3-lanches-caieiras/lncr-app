server:
  port: 8080

spring:
  application:
    name: Lanches Caieiras
  jackson:
    default-property-inclusion: non_null
  datasources:
    postgres:
      url: "${POSTGRES_JDBC}"
      jdbcUrl: "${POSTGRES_JDBC}"
      username: "${POSTGRES_USER}"
      password: "${POSTGRES_PASSWORD}"
      driver-class-name: org.postgresql.Driver
    h2:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      password: sa
      console:
        enabled: true
        path: /h2-console
  #jpa: #Configurações do JPA estão definidas no arquivo br.com.tp.lanchescaieiras.commons.config.JPAConfig.java
  #  hibernate:
  #    ddl-auto: update
  #  show-sql: true

lncr:
  base-url: "${LNCR_BASE_URL}"

  integration:
    food-items-url: "${lncr.base-url}/foodItems"
    customers-url: "${lncr.base-url}/customers"
    customer-order-url: "${lncr.base-url}/customerOrders"
    kitchen-order-url: "${lncr.base-url}/kitchenOrders"
    payment-url: "${lncr.base-url}/payments/mercadoPago"


  customer:
    location-prefix: "${lncr.base-url}/customers"

  customer-order:
    location-prefix: "${lncr.base-url}/customerOrders"

  food-item:
    location-prefix: "${lncr.base-url}/foodItems"
    max-images: 5
    image:
      location-prefix: "${lncr.base-url}/foodItems/image"
      directory: "./images/"
      maxSize: 524288 # 512 KB
      allowed-extensions:
        ".jpg": "FFD8"
        ".png": "89504E47"

  kitchen-order:
    location-prefix: "${lncr.base-url}/kitchenOrders"

  mercadopago:
    location-prefix: "${lncr.base-url}/payments/mercadoPago"
    callbackUrl: "${MERCADOPAGO_CALLBACK_URL}" #Webhook para notificação de pagamento
    chargeUrl: "${MERCADOPAGO_QRCODE_URL}"
    paymentUrl: "${MERCADOPAGO_PAYMENTS_URL}"
    accessToken: "${MERCADOPAGO_ACCESS_TOKEN}" #.env
    userId: "${MERCADOPAGO_USER_ID}" #.env
    posId: "${MERCADOPAGO_POS_ID}" #.env
    mercado-pago-mock: false
    mercado-pago-mock-customer-order-id: 1