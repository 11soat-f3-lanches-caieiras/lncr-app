                  status: Preparing

    GetFoodItem:
      description: Informação do Item de Alimentacao
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetFoodItemType'
          examples:
            GetFoodItem:
              summary: Item de Alimentacao encontrado com sucesso
              value:
