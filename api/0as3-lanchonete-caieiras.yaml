openapi: 3.0.1
info:
  title: Lanchonete Caieiras
  description: 'Gerenciador de Pedidos, Ordem de Preparo, Produtos e Pagamento'
  contact:
    email: titoparizotto@gmail.com
    name: Tito de Morais Parizotto
  version: 1.0.0
servers:
  - url: 'https://localhost:8080/lanchoneteCaieiras/v1'
tags:
  - name: CollectionOperations
    description: Operações que utilizam arquetipo Colecoes
  - name: ManagedOperations
    description: Operações que utilizam arquetipo Gerenciavel

paths:
  '/customers':
    post:
      operationId: createCustomer
      description: Criar um novo cliente
      summary: Criar um novo cliente
      tags:
        - CollectionOperations
      requestBody:
        $ref: '#/components/requestBodies/CreateCustomer'
      responses:
        '201':
          $ref: '#/components/responses/CreatedCustomer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictCustomer'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listCustomers
      description: Lista de clientes
      summary: Listar clientes com de filtros
      tags:
        - CollectionOperations
      parameters:
        - $ref: '#/components/parameters/CustomerStatus'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListCustomers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  '/customer/{customerDocument}':
    get:
      operationId: getCustomer
      description: Obter um cliente pelo documento
      summary: Obter informacoes de um cliente pelo documento
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerDocument'
      responses:
        '200':
          $ref: '#/components/responses/GetCustomer'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: partialUpdateCustomer
      description: Atualizar parcialmente os dados de um cliente
      summary: Atualizar parcialmente os dados de um cliente
      security:
        - basicAuth: []
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerDocument'
      requestBody:
        $ref: '#/components/requestBodies/PartialUpdateCustomer'
      responses:
        '200':
          $ref: '#/components/responses/PartialUpdateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteCustomer
      description: Deletar dados de um cliente
      summary: Deletar dados de um cliente
      security:
        - basicAuth: []
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerDocument'
      responses:
        '200':
          $ref: '#/components/responses/DeletedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'  
      
  '/foodItems':
    post:
      operationId: createFoodItem
      description: Criar um novo item
      summary: Criar um novo Item de Alimentacao
      security:
        - basicAuth: []
      tags:
        - CollectionOperations
      requestBody:
        $ref: '#/components/requestBodies/CreateFoodItem'
      responses:
        '201':
          $ref: '#/components/responses/CreatedFoodItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getListFoodItem
      description: Buscar Lista de Items de Alimentacao
      summary: Buscar Lista de Items de Alimentacao
      tags:
        - CollectionOperations
      parameters:
        - $ref: '#/components/parameters/FoodStatus'
        - $ref: '#/components/parameters/FoodCategory'
      responses:
        '200':
          $ref: '#/components/responses/ListFoodItems'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'  
  
  '/foodItems/{id}':
    get:
      operationId: getFoodItem
      description: Buscar Item de Alimentacao por Id
      summary: Buscar Item de Alimentacao por Id
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GetFoodItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: partialUpdateFoodItem
      description: Atualizar parcialmente informacoes de um item de Alimentacao
      summary: Atualizar parcialmente informacoes de um item de Alimentacao
      security:
        - basicAuth: []
      tags:
      - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        $ref: '#/components/requestBodies/PartialUpdateFoodItem'
      responses:
        '200':
          $ref: '#/components/responses/GetFoodItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteFoodItem
      description: Deletar dados de um item de alimentacao
      summary: Deletar dados de um item de alimentacao
      security:
        - basicAuth: []
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/DeletedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  '/customerOrders':
    post:
      operationId: createCustomerOrder
      description: Criar um novo pedido do Cliente
      summary: Criar um novo pedido do Cliente
      tags:
        - CollectionOperations
      requestBody:
        $ref: '#/components/requestBodies/CreateCustomerOrder'
      responses:
        '200':
          $ref: '#/components/responses/CreatedCustomerOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
        operationId: getListCustomerOrders
        description: Buscar Lista de Pedidos de Clientes
        summary: Buscar Lista de Pedidos de Clientes
        tags:
          - CollectionOperations
        parameters:
          - $ref: '#/components/parameters/CustomerOrderStatus'
          - $ref: '#/components/parameters/CustomerDocumentNumber'
        responses:
          '200':
            $ref: '#/components/responses/ListCustomerOrders'
          '400':
            $ref: '#/components/responses/BadRequest'
          '500':
            $ref: '#/components/responses/InternalServerError'
  '/customerOrder/{id}':
    get:
      operationId: getCustomerOrder
      description: Buscar Pedido do cliente por id
      summary: Buscar Pedido do cliente por id
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerOrderId'
      responses:
        '200':
          $ref: '#/components/responses/GetCustomerOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
  '/customerOrder/{id}/{newStatus}':
    patch:
      operationId: customerOrderUpdateStatus
      description: Atualizar status do pedido do cliente
      summary: Atualizar status do pedido do cliente
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerOrderId'
        - $ref: '#/components/parameters/CustomerOrderNewStatus'
      responses:
        '200':
          $ref: '#/components/responses/PartialUpdateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    
  '/kitchenOrders':
    post:
      operationId: createKitchenOrder
      description: Criar uma nova ordem de preparo
      summary: Criar uma nova ordem de preparo
      tags:
        - CollectionOperations
      requestBody:
        $ref: '#/components/requestBodies/CreateKitchenOrder'
      responses:
        '200':
          $ref: '#/components/responses/CreatedKitchenOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getKitchenOrders
      description: Buscar lista de ordens de preparo
      summary: Buscar lista de ordens de preparo
      tags:
        - CollectionOperations
      parameters:
        - $ref: '#/components/parameters/KitchenCustomerOrderId'
        - $ref: '#/components/parameters/KitchenOrderStatus'
      responses:
        '200':
          $ref: '#/components/responses/ListKitchenOrders'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
  '/kitchenOrders/{id}':
    get:
      operationId: getKitchenOrder
      description: Buscar uma ordem de prepraro por id
      summary: Buscar uma ordem de preparo por id
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/KitchenOrderId'
      responses:
        '200':
          $ref: '#/components/responses/GetKitchenOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  '/kitchenOrders/{id}/{newStatus}':
    patch:
      operationId: kitchenOrderUpdateStatus
      description: Atualizar status de uma ordem de preparo
      summary: Atualizar status de uma ordem de preparo
      tags:
        - ManagedOperations
      parameters:
        - $ref: '#/components/parameters/CustomerOrderId'
        - $ref: '#/components/parameters/KitchenOrderNewStatus'
      responses:
        '200':
          $ref: '#/components/responses/PartialUpdateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'  
  
  
  
  
  
components:
  requestBodies:
    CreateCustomer:
      description: Criar Cliente request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCustomerType'
          examples:
            CreateCustomer:
              summary: Criação de Cliente
              value:
                documentNumber: 1111111111
                name: José da Silva
                e-mail: josedasilva@email.com
            BadRequestWithoutFields:
              summary: Campos faltantes
              value:
                name: José da Silva
                e-mail: josedasilva@email.com
    CreateFoodItem:
      description: Criar Item de Alimentacao request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateFoodItemType'
          examples:
            CreateFoodItem:
              summary: Criar Item de Alimentacao - Lanche
              value:
                name: X-Salada
                description: 'Pão de Hamburger, hamburger bovino de 120g, queijo, tomate, salada, maionese, ketchup.'
                category: Sandwich
                price: 29.99
                images:
                  image: 
            BadRequestWithoutFields:
              summary: Campos faltantes
              value:
                name: X-Salada
                description: 'Pão de Hamburger, hamburger bovino de 120g, queijo, tomate, salada, maionese, ketchup.'
                category: Sandwich
    CreateCustomerOrder:
      description: Pedido do Cliente request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCustomerOrderType'
          examples:
            CreateCustomerOrderWithIdentification:
              summary: Novo pedido do Cliente que se identificou
              value:
                customer:
                  customerId: 1
                  documentNumber: 11111111111
                  name: José da Silva
                order:
                  foodItems:
                    - id: 1
                      name: "X-Salada"
                      category: "Sandwich"
                      price: 29.90
                      notes: "Ponto da Carne: Ao ponto"
                    - id: 2
                      name: "Coca-cola zero"
                      category: "Drink"
                      price: 9.99
                      notes: "Sem gelo"
                    - id: 3
                      name: "Batata-frita"
                      category: "Side"
                      price: 5.99
                    - id: 4
                      name: "Sorvete de Chocolate"
                      category: "Dessert"
                      price: 9.99
                      notes: "Trocar amendoin por flocos de arroz"
            CreateCustomerOrderWithoutIdentification:
              summary: Novo pedido do Cliente que se não identificou
              value:
                order:
                  foodItems:
                    - id: 1
                      name: "X-Salada"
                      category: "Sandwich"
                      price: 29.90
                      notes: "Ponto da Carne: Ao ponto"
                    - id: 2
                      name: "Coca-cola zero"
                      category: "Drink"
                      price: 9.99
                      notes: "Sem gelo"
                    - id: 3
                      name: "Batata-frita"
                      category: "Side"
                      price: 5.99
                    - id: 4
                      name: "Sorvete de Chocolate"
                      category: "Dessert"
                      price: 9.99
                      notes: "Trocar amendoin por flocos de arroz"
    CreateKitchenOrder:
      description: Ordem de preparo request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateKitchenOrderType'
          examples:
            CreateKitchenOrder:
              summary: Nova Ordem de preparo
              value:
                customerOrder:
                  id: 1
                foodItems:
                    - id: 1
                      name: "X-Salada"
                      category: "Sandwich"
                      notes: "Ponto da Carne: Ao ponto"
                    - id: 2
                      name: "Coca-cola zero"
                      category: "Drink"
                      notes: "Sem gelo"
                    - id: 3
                      name: "Batata-frita"
                      category: "Side"
                    - id: 4
                      name: "Sorvete de Chocolate"
                      category: "Dessert"
                      notes: "Trocar amendoin por flocos de arroz"
    PartialUpdateCustomer:
      description: Atualizar informacoes parciais do cliente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartialUpdateCustomerType'
          examples:
            UpdateInfo:
              summary: Atualizar cliente
              value:
                name: João da Silva
                email: joaodasilve@gmail.com
            UpdateName:
              summary: Atualizar nome
              value:
                name: João da Silva
            UpdateEmail:
              summary: Atualizar e-mail
              value:
                email: joaodasilve@gmail.com
    PartialUpdateFoodItem:
      description: Atualizar informacoes parciais do Item de Alimentacao
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartialUpdateFoodItemType'
          examples:
            UpdateInfo:
              summary: Atualizar informacoes de um Item de Alimentacao
              value:
                name: X-Salada
                description: 'Pão de Hamburger com gergelim, hamburger bovino de 120g, queijo, tomate, salada, maionese, ketchup.'
                category: Sandwich
                price: 19.99
            UpdateTwoOrMorFields:
              summary: Atualizar um ou mais campos de um Item de Alimentacao
              value:
                description: 'Pão de Hamburger com gergelim, hamburger bovino de 120g, queijo, tomate, salada, maionese, ketchup.'
                price: 19.99
  
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseTemplate'
          examples:
            RegistrationNumberWrongFormat:
              summary: Erro de formato inválido
              value:
                _response:
                  _traceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  _timestamp: '2025-02-12T21:41:43.286Z'
    ConflictCustomer:
      description: Conflict Customer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseTemplate'
          examples:
            RegistrationNumberWrongFormat:
              summary: Documento já utilizado
              value:
                _response:
                  _traceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  _timestamp: '2025-02-12T21:41:43.286Z'
                  _message: Documento informado já foi utilizado.
    
    CreatedCustomer:
      description: Cliente criado com sucesso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedCustomerType'
          examples:
            CreatedCustomer:
              summary: Cliente criado com sucesso
              value:
                _response:
                  _traceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  _timestamp: '2025-02-12T21:41:43.286Z'
                customerId: 1
      headers:
        Location:
          $ref: '#/components/headers/Location'
          
    CreatedCustomerOrder:
      description: Pedido do cliente criado com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedCustomerOrderType'
          examples:
            CreateCustomerOrder:
              summary: Novo pedido do Cliente que se identificou
              value:
                _response:
                  _traceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  _timestamp: '2025-02-12T21:41:43.286Z'
                order:
                  id: 1
                  totalCost: 55.87
                  status: Pending Payment
      headers:
        Location:
          $ref: '#/components/headers/Location'
    
    CreatedKitchenOrder:
      description: Ordem de preparo criada com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedKitchenOrderType'
          examples:
