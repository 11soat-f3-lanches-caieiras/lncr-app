    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseTemplate'
          examples:
            InternalError:
              summary: Erro Interno
              value:
                response:
                  _traceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  _timestamp: '2025-02-12T21:41:43.286Z'
    ListCustomers:
      description: Lista de clientes retornadas com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListCustomersType'
    
    ListCustomerOrders:
      description: Lista de pedido de clientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListCustomerOrdersType'
            
    ListFoodItems:
      description: Lista de Items de Alimentacao retornados com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListFoodItemsType'
    
    ListKitchenOrders:
      description: Lista de ordens de preparo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListKitchenOrdersType'
    
            
    NoContent:
      description: No Content
    
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
