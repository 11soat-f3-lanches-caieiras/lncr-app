server:
  port: 8080
spring:
  application:
    name: Lanches Caieiras
    jackson:
      default-property-inclusion: non_null
  datasources:
    postgres:
      jdbcUrl: "${POSTGRES_URL}"
      username: "${POSTGRES_USER}"
      password: "${POSTGRES_PASSWORD}"
      driver-class-name: org.postgresql.Driver
  #jpa: #Configurações do JPA estão definidas no arquivo br.com.tp.lanchescaieiras.commons.config.JPAConfig.java
  #  hibernate:
  #    ddl-auto: update
  #  show-sql: true

lncr:
  base-url: "${LNCR_BASE_URL}"
  integration:
    customers-url: "${lncr.base-url}/customers"
    customers-list-url: "${lncr.base-url}/customers/listIds"
    customer-orders-url: "${lncr.base-url}/customerOrders"
    food-items-url: "${lncr.base-url}/foodItems"
    food-items-list-url: "${lncr.base-url}/foodItems/listIds"
    kitchen-orders-url: "${lncr.base-url}/kitchenOrders"
    payments-url: "${lncr.base-url}/payments/mercadoPago"
    notification-url: "${lncr.base-url}/notifications"

  oauth:
    oAuthSecretKey: "${LNCR_OAUTH_SECRET_KEY}"
    expireIn: 31536000
    profiles:
      admin:
        clientId: "${LNCR_OAUTH_ADMIN_CLIENT_ID}"
        clientSecret: "${LNCR_OAUTH_ADMIN_CLIENT_SECRET}"
        scope: "admin"
        grantType: "client_credentials"
      customer:
          scope: "customer"
          grantType: "client_credentials"
      monitor:
          clientId: "${LNCR_OAUTH_MONITOR_CLIENT_ID}"
          clientSecret: "${LNCR_OAUTH_MONITOR_CLIENT_SECRET}"
          scope: "monitor"
          grantType: "client_credentials"
      totem: # Self Service Terminal - Totem
        clientId: "${LNCR_OAUTH_TOTEM_CLIENT_ID}"
        clientSecret: "${LNCR_OAUTH_TOTEM_CLIENT_SECRET}"
        scope: "totem"
        grantType: "client_credentials"

  customer:
    location-prefix: "${lncr.base-url}/customers"

  customer-order:
    location-prefix: "${lncr.base-url}/customerOrders"

  food-item:
    location-prefix: "${lncr.base-url}/foodItems"
    max-images: 5
    image:
      location-prefix: "${lncr.base-url}/foodItems/image"
      directory: "/app/images/"
      maxSize: 524288 # 512 KB
      allowed-extensions:
        ".jpg": "FFD8"
        ".png": "89504E47"

  kitchen-order:
    location-prefix: "${lncr.base-url}/kitchenOrders"

  mercadopago:
    location-prefix: "${lncr.base-url}/payments/mercadoPago"
    oauth-url: "${MERCADOPAGO_OAUTH_URL}"
    orders-url: "${MERCADOPAGO_ORDERS_URL}"
    client-id: "${MERCADOPAGO_CLIENT_ID}"
    secret-id: "${MERCADOPAGO_SECRET_ID}"#.env
    pos-id: "${MERCADOPAGO_POS_ID}" #.env
    expiration-time: PT1H # 1 hora

  notification:
    location-prefix: "${lncr.base-url}/notifications"
