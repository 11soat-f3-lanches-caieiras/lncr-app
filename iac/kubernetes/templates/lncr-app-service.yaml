apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-nlb
  labels:
    app: {{ .Values.app.name }}
  annotations:
    service\.beta\.kubernetes\.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.app.name }}